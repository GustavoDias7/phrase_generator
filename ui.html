<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Phrase Generator</title>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<style>
    body {
        font-family: sans-serif;
        margin: 18px;
        color: #222;
        background: #fff;
    }
    h2 { margin-top: 0; }
    .grid {
        display: grid;
        grid-template-columns: 180px 1fr;
        gap: 12px 14px;
        align-items: start;
    }
    label {
        font-weight: 600;
        padding-top: 8px;
    }
    input, select, textarea, button {
        font: inherit;
        box-sizing: border-box;
    }
    input, select, textarea {
        width: 100%;
        padding: 8px;
        border: 1px solid #aaa;
        border-radius: 4px;
    }
    textarea { min-height: 75px; resize: vertical; }
    .hint {
        grid-column: 2;
        color: #666;
        font-size: 0.9em;
        margin-top: -6px;
    }
    .actions {
        margin-top: 18px;
        display: flex;
        justify-content: flex-end;
    }
    button {
        padding: 9px 18px;
        cursor: pointer;
    }
</style>
</head>
<body>
<h2>Phrase Generator</h2>

<div class="grid">
    <label for="generateBy">Generate by</label>
    <select id="generateBy">
        <option value="word">Word</option>
        <option value="term">Term</option>
        <option value="chunk">Chunk</option>
        <option value="grammar rule" selected>Grammar rule</option>
    </select>

    <label for="grammarRule">Grammar rule / target</label>
    <input id="grammarRule" placeholder="e.g. Present Perfect">

    <label for="amount">Amount of phrases</label>
    <input id="amount" type="number" min="1" max="100" value="10">

    <label for="subjectsMode">Subjects / context</label>
    <select id="subjectsMode" onchange="updateSubjects()">
        <option value="AI choice" selected>Not specified — AI choice</option>
        <option value="Pre-computed list">Pre-computed list</option>
        <option value="User context">Type a new / specific context</option>
    </select>

    <label for="subjects">Subjects</label>
    <textarea id="subjects" placeholder="e.g. small talk, work, programming"></textarea>
    <div class="hint">For a pre-computed list, separate subjects with commas or lines.</div>

    <label for="phraseSize">Phrase size</label>
    <select id="phraseSize">
        <option value="S — up to 3 words">S — up to 3 words</option>
        <option value="M — 3–5 words" selected>M — 3–5 words</option>
        <option value="L — 5–7 words">L — 5–7 words</option>
    </select>

    <label for="examples">Examples</label>
    <textarea id="examples" placeholder="Add example sentences here..."></textarea>
    <div class="hint">Reference examples for the AI. The generated phrases should be new.</div>

    <label for="blacklist">Blacklist</label>
    <textarea id="blacklist" placeholder="Terms or expressions to avoid..."></textarea>
</div>

<div class="actions">
    <button onclick="generate()">Compose prompt</button>
</div>

<script>
let bridge = null;

new QWebChannel(qt.webChannelTransport, function(channel) {
    bridge = channel.objects.bridge;
});

function updateSubjects() {
    const mode = document.getElementById("subjectsMode").value;
    const field = document.getElementById("subjects");
    field.disabled = mode === "AI choice";
    if (mode === "AI choice") field.value = "";
    field.placeholder =
        mode === "Pre-computed list"
        ? "e.g. work, travel, family, programming"
        : "e.g. small talk about work";
}

function generate() {
    if (!bridge) {
        alert("The application bridge is not ready.");
        return;
    }

    bridge.generate_prompt(
        document.getElementById("generateBy").value,
        document.getElementById("grammarRule").value,
        document.getElementById("amount").value,
        document.getElementById("subjectsMode").value,
        document.getElementById("subjects").value,
        document.getElementById("phraseSize").value,
        document.getElementById("examples").value,
        document.getElementById("blacklist").value
    );
}

updateSubjects();
</script>
</body>
</html>
